# Reconstructed from the lab report screenshots (Figure 7.3.4) and the report text.
# /etc/samba/smb.conf
# PARTIAL: only the tail of the file (the stock [printers] and [print$] sections and
# the added share) is legible. The [global] section and the start of [homes] are not shown.
# The report names the share after a team member; it is renamed LabShare / labuser here.
# ... (top of file not shown)

[printers]
	comment = All Printers
	path = /var/tmp
	printable = Yes
	create mask = 0600
	browseable = No

[print$]
	comment = Printer Drivers
	path = /var/lib/samba/drivers
	# printadmin is a local group
	write list = printadmin root
	force group = printadmin
	create mask = 0664
	directory mask = 0775

# Added by the group. The report text also lists "comment = Secure Share for <user>"
# as the first line of the share; the screenshot does not show a comment line.
[LabShare]
	path = /srv/samba/lab_share
	valid users = labuser
	writable = yes
	browsable = yes
	guest ok = no
