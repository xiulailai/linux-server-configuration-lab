# Reconstructed from the lab report screenshots (Figures 3.5.11 and 3.5.12).
# /etc/dovecot/conf.d/10-master.conf - only the two socket blocks are shown. In the stock
# file the first block sits inside "service auth { ... }"; that wrapper was not captured.

# Postfix smtp-auth
unix_listener /var/spool/postfix/private/auth {
  mode = 0660
  user = postfix
  group = postfix
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
