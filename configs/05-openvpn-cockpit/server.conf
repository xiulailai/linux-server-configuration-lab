# /etc/openvpn/server/server.conf
# Reconstructed from the lab report screenshots (Figures 5.3.1.12 to 5.3.1.20, 5.6.4.4, 5.6.5.4).
# PARTIAL FILE: this is the sample server.conf from the openvpn package with the lines the
# report edited. Only those lines are shown; the stock comments and every other directive are omitted.
# No key or certificate bodies are included. The files named below sit next to this file.

ca ca.crt
cert issued/tapauserver1.crt
key private/tapauserver1.key
dh dh.pem

server 10.11.0.0 255.255.255.0

# The sample file's push line was commented out (Figure 5.6.5.4) after the client ended up with a
# second route to 192.168.200.0/24 through the tunnel (Figure 5.6.5.2). The report shows it only in its commented form:
;push "route 192.168.200.0 255.255.255.0"

keepalive 10 120

tls-auth ta.key 0

# Compression was commented out (Figure 5.6.4.4, "before"):
;comp-lzo

persist-key
persist-tun

status /var/log/openvpn-status.log

# The report shows both of the next two lines active (Figure 5.3.1.17).
# The stock file says to use one or the other, not both.
log         /var/log/openvpn.log
log-append  /var/log/openvpn.log

verb 3

explicit-exit-notify 1

# Replaces the stock "cipher AES-256-CBC" line (Figure 5.6.4.4)
data-ciphers AES-256-GCM
data-ciphers-fallback AES-128-GCM
auth SHA256

# ...
