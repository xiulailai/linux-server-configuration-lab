# /etc/openvpn/client/client.conf (Ubuntu 24.04 client)
# Reconstructed from the lab report screenshots (Figures 5.3.2.9 and 5.6.4.3, "after" version).
# Complete as shown. The certificate and key files are copied from the server and are not
# part of this repo.

client

dev tun

proto udp

remote 192.168.200.4 1194

resolv-retry infinite

nobind

persist-key
persist-tun

ca /etc/openvpn/client/ca.crt
cert /etc/openvpn/client/tapauclient1.crt
key /etc/openvpn/client/tapauclient1.key
tls-auth /etc/openvpn/client/ta.key 1

verb 3

data-ciphers AES-256-GCM
data-ciphers-fallback AES-128-GCM
auth SHA256

remote-cert-tls server

# The first client.conf (Figure 5.6.4.3, "before") also had "comp-lzo" and
# "cipher AES-256-CBC" instead of the data-ciphers lines, and no remote-cert-tls line.
