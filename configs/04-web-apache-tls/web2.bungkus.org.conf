# Reconstructed from the lab report screenshots. (Figures 4.7.4 and 4.5.2)
# Install as /etc/httpd/conf.d/web2.bungkus.org.conf
# The file was typed in two nano screens; the two halves are joined here.

# Redirect HTTP to HTTPS
<VirtualHost *:80>
	ServerName      web2.bungkus.org
	ServerAlias     www.web2.bungkus.org
	Redirect permanent / https://web2.bungkus.org/
</VirtualHost>

# HTTPS Virtual Host
<VirtualHost *:443>
	ServerName      web2.bungkus.org
	ServerAlias     www.web2.bungkus.org
	DocumentRoot    /var/www/web2.bungkus.org/html
	ErrorLog        /var/log/httpd/web2.bungkus.org-error.log
	CustomLog       /var/log/httpd/web2.bungkus.org-access.log combined

	# TLS/SSL settings
	SSLEngine       on
	SSLCertificateFile /etc/pki/tls/certs/web2.bungkus.org.crt
	SSLCertificateKeyFile /etc/pki/tls/private/web2.bungkus.org.key

	# Enforce TLS 1.2 and above only
	SSLProtocol     all -SSLv3 -TLSv1 -TLSv1.1

	<Directory /var/www/web2.bungkus.org/html>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
