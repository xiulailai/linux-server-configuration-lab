# Reconstructed from the lab report screenshots (Figures 1.3.1, 1.4.1, 1.9.3).
# PARTIAL FILE: only the parts visible in the screenshots are included.
# The stock Rocky 9 options block has more lines than are shown here
# (the screenshots cut off between the comment block and the end of options).
# Port-53 listen addresses and allow-query are wide open in the lab; see docs.

options {
	listen-on port 53 { 127.0.0.1;any; };
	listen-on-v6 port 53 { ::1; };
	directory       "/var/named";
	dump-file       "/var/named/data/cache_dump.db";
	statistics-file "/var/named/data/named_stats.txt";
	memstatistics-file "/var/named/data/named_mem_stats.txt";
	secroots-file   "/var/named/data/named.secroots";
	recursing-file  "/var/named/data/named.recursing";
	allow-query     { localhost;any; };
	forwarders      { 8.8.8.8; };

	/* (stock explanatory comment block about recursion omitted) */
	recursion yes;

	# Final state after the troubleshooting in section 1.9 (was "yes" first).
	dnssec-validation no;

	managed-keys-directory "/var/named/dynamic";
	geoip-directory "/usr/share/GeoIP";

	pid-file "/run/named/named.pid";
	session-keyfile "/run/named/session.key";

	/* https://fedoraproject.org/wiki/Changes/CryptoPolicy */
	include "/etc/crypto-policies/back-ends/bind.config";
};

logging {
	# ... (stock logging block not shown in the report)
};

# ... (stock zone "." hint declaration, shown in Figure 1.4.1)
zone "." IN {
	type hint;
	file "named.ca";
};

zone "bungkus.org" IN {
	type master;
	file "fwd.bungkus.org.db";
	allow-update { none; };
};

zone "200.168.192.in-addr.arpa" IN {
	type master;
	file "rvs.200.168.192.db";
	allow-update { none; };
};

include "/etc/named.rfc1912.zones";
include "/etc/named.root.key";
